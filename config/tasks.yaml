# =====================================================================
#  상권 이전 컨설팅 자동화 — 태스크(작업) 정의 + 프롬프트
#
#  기법: 역할 프롬프팅 / 제약([준수 규칙]) / Chain-of-Thought /
#        XML 태깅(<현재사업지> 등) / 스키마 강제(output_pydantic) /
#        배점표(rubric) / Negative Prompting / 근거·인용
#  각 태스크는 앞 태스크의 '구조화된 결과'를 context 로 받아 환각을 줄인다.
# =====================================================================

# 1단계: 현재 사업 현황 분석 → BusinessProfile
analyze_business_task:
  description: >
    아래 사업자 정보를 분석하여 이 사업의 정체성과 '새 입지 필수 조건'을 도출하라.

    <사업자정보>
    - 사업체명: {business_name}
    - 업종: {industry}
    - 현재 사업지: {current_site}
    - 이전 사유: {relocation_reason}
    - 우선순위(선택): {priorities}
    - 예산/임대 조건(선택): {budget}
    </사업자정보>

    [사고 절차 — 내부적으로 단계적으로 생각한 뒤 결과만 출력하라]
    1. 이 업종의 수익 모델과 핵심 고객층은 누구인가?
    2. 현재 사업지의 상권 특성은 어떠하며, 이전을 유발한 '진짜 요인'은 무엇인가?
    3. 그 요인을 해소하려면 새 입지가 '반드시' 갖춰야 할 조건은 무엇인가?
    4. 반대로 사장님이 감수할 수 없는 리스크(민감 요소)는 무엇인가?

    [준수 규칙]
    - 제출 정보에 없는 매출·고객 수치를 지어내지 말 것. 추정 시 '추정'으로 명시.
    - 업종 특성을 반드시 반영할 것.
  expected_output: >
    BusinessProfile 스키마에 맞는 구조화 결과.
  agent: site_analyst

# 2단계: 후보 3곳 입지 분석 → CandidateSitesReport
analyze_sites_task:
  description: >
    1단계에서 도출한 사업 프로필을 참고하여, 아래 3개 이전 후보지를
    동일한 잣대로 각각 분석하라.

    <이전후보지 목록>
    {candidate_sites_block}
    </이전후보지 목록>

    [각 후보지마다 평가할 항목]
    - 유동인구 성격 (연령/시간대/평일·주말, 우리 업종에 유리한가)
    - 임대료 수준 (해당 상권 통상 시세 대비 높음/보통/낮음)
    - 경쟁 강도 (동일·유사 업종 밀집도)
    - 접근성 (대중교통·주차·가시성)
    - 타깃 고객 적합성 (1단계 핵심 고객과의 일치도)

    [준수 규칙]
    - SERPER_API_KEY 가 있으면 웹 검색으로 시세·상권 정보를 보강하고,
      확인된 사실에는 근거(출처 요지, 30자 이내)를 붙일 것.
    - 검색으로 확인한 것과 상권 원리로 추론한 것을 구분해 표기할 것.
    - 확인 불가 항목은 "정보 부족"으로 남길 것. 단정 금지.
  expected_output: >
    CandidateSitesReport 스키마에 맞는 구조화 결과(후보지 3개 모두 포함).
  agent: location_scout
  context:
    - analyze_business_task

# 3단계: 적합도 채점·순위·추천 → RelocationFitReview
evaluate_fit_task:
  description: >
    1단계 사업 프로필과 2단계 후보지 분석을 대조하여, 아래 배점표대로
    각 후보지를 채점하고 순위를 매긴 뒤 최종 추천지를 결정하라.

    [배점표 rubric — 총 100점]
    - 타깃 고객 적합성 ............ 35
    - 수익성(유동인구 대비 임대료) . 30
    - 경쟁·리스크 회피 ........... 20
    - 접근성·운영 편의 ........... 15

    [사고 절차]
    1. 후보지별로 항목 점수를 매기고, 왜 그 점수인지 한 줄 근거를 남긴다.
    2. 합산 점수로 순위를 정한다.
    3. 1위 후보의 강점과 남은 리스크를 정리한다.
    4. 최종 판정: immediate / conditional / reconsider.

    [준수 규칙]
    - 반드시 항목별 점수 → 합산 → 순위 순서로 근거를 남길 것.
    - 근거 없는 '느낌' 결론 금지. 동점일 때는 리스크가 적은 쪽을 우선.
  expected_output: >
    RelocationFitReview 스키마에 맞는 구조화 결과.
  agent: fit_evaluator
  context:
    - analyze_business_task
    - analyze_sites_task

# 4단계: 자연어 상담 리포트 생성 (파일 저장)
build_report_task:
  description: >
    앞의 세 결과를 종합하여, 사장님이 3분 안에 읽고 결정할 수 있는
    '자연어 상담 리포트'를 작성하라. 표 위주가 아니라 상담하듯 설명하는
    문장 흐름으로 쓴다.

    [리포트 구성 — 자연어 문단으로]
    1. 한 줄 결론: "○○ 후보지(주소)로 이전하시길 권합니다 / 조건부 권합니다 / 재검토를 권합니다."
    2. 왜 그곳인가: 사업 특성과 연결해 이유를 설명 (다른 후보와 비교하며).
    3. 탈락/차순위 후보 짧은 평: 각 후보가 왜 밀렸는지 한두 문장.
    4. 남은 리스크와 대비책.
    5. 이전 전 반드시 확인할 것: 계약·인허가·권리금 등 체크 항목을 자연스러운 문장으로.

    [준수 규칙]
    - 앞 단계 분석 '내용'을 바꾸지 말 것(순서·표현만 재배치).
    - 진부한 표현·과장('무조건 대박', '초대박 상권') 금지.
    - 숫자를 인용할 때는 그것이 추정치인지 확인값인지 밝힐 것.
  expected_output: >
    사장님께 그대로 전달 가능한 자연어 마크다운 상담 리포트 전문(全文).
  agent: consulting_reporter
  context:
    - analyze_business_task
    - analyze_sites_task
    - evaluate_fit_task
  output_file: output/report_{business_id}.md
