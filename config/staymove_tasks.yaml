# Stay or Move — 설명 태스크
explain_task:
  description: >
    아래는 '이미 계산이 끝난' 매장 이전 의사결정 데이터(JSON)입니다.
    이 숫자만 근거로, {business_name} 사장님께 드릴 자연어 상담 리포트를 작성하세요.

    <계산결과>
    {facts_json}
    </계산결과>

    추천 후보: {recommended}

    [사고 절차 — 내부적으로만]
    1. 추천 후보의 최소 필요 월매출과 필요 유지율이 '현실적으로 달성 가능한 수준'인지 판단한다.
    2. 초기 이전 자금과 회수기간 시나리오에서 가장 중요한 리스크를 고른다.
    3. 차순위·탈락 후보가 왜 밀렸는지 숫자로 설명한다.

    [리포트 구성 — 자연어 문단으로, 표 나열 금지]
    1. 한 줄 결론: "○○(후보 코드·지역)로 이전을 [권장/조건부 권장/재검토 권고]합니다."
    2. 왜 그곳인가: 최소 필요매출·유지율을 근거로, 현재 수익 유지 관점에서 설명.
    3. 남은 리스크: 회수기간 시나리오 중 조심할 지점(특히 매출 하락 시).
    4. 차순위/탈락 후보 짧은 평: 각 후보가 왜 밀렸는지 한두 문장.
    5. 이전 전 확인사항: 계약·인허가·권리금 등 자연스러운 문장으로.

    [준수 규칙]
    - <계산결과>에 없는 숫자를 새로 만들지 말 것.
    - 매출 관련 수치는 '거래내역 기반 계산값', 상권 지표는 '공개데이터 추정치'임을 한 번 명시.
  expected_output: >
    사장님께 그대로 전달 가능한 자연어 마크다운 상담 리포트 전문.
  agent: explainer
