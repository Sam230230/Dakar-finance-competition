# Stay or Move — 설명 태스크
explain_task:
  description: >
    아래는 '이미 계산이 끝난' 매장 이전 의사결정 데이터(JSON)입니다.
    이 숫자만 근거로, {business_name} 사장님께 드릴 자연어 상담 리포트를 작성하세요.

    <계산결과>
    {facts_json}
    </계산결과>

    1순위 후보: {top_site_id}

    [사고 절차 — 내부적으로만]
    1. 1순위 후보의 최소 필요 월매출과 필요 유지율이 '현실적으로 달성 가능한 수준'인지 판단한다.
    2. 추가로 필요한 이전 자금(가용현금 반영 후) 규모에서 가장 중요한 부담 요인을 고른다.
    3. 다른 후보가 왜 순위가 밀렸는지 숫자로 설명한다.

    [리포트 구성 — 자연어 문단으로, 표 나열 금지]
    1. 한 줄 요약: "○○(후보 코드·지역)의 판정은 [여유 있음/빠듯함/재검토 필요]입니다." (추천이 아니라
       현재 숫자로 계산된 판정 결과임을 분명히 한다 — "권장합니다"처럼 최종 결정을 대신 내리는 표현은 쓰지 않는다.)
    2. 왜 이런 판정인가: 최소 필요매출·유지율을 근거로, 현재 수익 유지 관점에서 설명.
    3. 자금 부담: 추가로 필요한 이전 자금(권리금·원상복구비 포함)과 가용현금 대비 부족/여유분.
    4. 다른 후보 짧은 평: 각 후보가 왜 순위가 밀렸는지 한두 문장.
    5. 이전 전 확인사항: 계약·인허가·권리금 등 자연스러운 문장으로.

    [준수 규칙]
    - <계산결과>에 없는 숫자를 새로 만들지 말 것.
    - 매출 관련 수치는 '거래내역 기반 계산값', 상권 지표는 '공개데이터 추정치'임을 한 번 명시.
    - 최종 이전 여부는 사장님이 판단할 몫이며, 이 리포트는 그 판단을 돕는 근거 제시임을 잊지 않는다.
    - 미래 매출이 특정 수준으로 유지된다고 가정하는 예측(예: "N개월 뒤에는 매출이 이렇게 될 것")은 하지 않는다.
  expected_output: >
    사장님께 그대로 전달 가능한 자연어 마크다운 상담 리포트 전문.
  agent: explainer
