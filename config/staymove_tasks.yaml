explain_task:
  description: >
    아래는 이미 계산이 끝난 매장 이전 경제성 데이터(JSON)입니다.
    {business_name} 사장님이 스스로 Stay or Move를 판단할 수 있도록 설명하세요.

    <계산결과>
    {facts_json}
    </계산결과>

    [리포트 구성]
    1. 핵심 판단조건: 현재 수익을 유지하기 위한 최소 필요매출과 필요 매출 유지율.
    2. 목표기간: 12/24/36개월 내 이전비 회수에 필요한 월매출을 설명.
    3. 회수기간: 90/95/100% 매출 유지 시 회수 가능 여부와 기간을 설명.
    4. 초기 이전자금: 추가로 묶이는 보증금과 실제 소모되는 이전비를 구분.
    5. 후보가 여러 개면 숫자를 나란히 비교하되 자동 순위나 추천을 만들지 말 것.

    [준수 규칙]
    - 계산결과에 없는 숫자를 만들지 말 것.
    - '이전 추천', '즉시 이전 권장', '최적 후보' 같은 표현 금지.
    - 상권 지표가 없는 경우 상권이 좋다/나쁘다고 추정하지 말 것.
  expected_output: >
    3~5개 짧은 문단으로 된 자연어 분석 설명.
  agent: explainer
