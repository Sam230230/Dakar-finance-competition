# Render Blueprint — 백엔드(Docker)와 프론트(정적) 두 서비스.
#
# 프론트를 컨테이너에 넣지 않는다. 빌드 결과가 657KB 정적 파일이라
# 정적 호스팅이 더 싸고 빠르다.
#
# 처음 올릴 때:
#   1. Render 대시보드 → New → Blueprint → 이 저장소 선택
#   2. sync:false 로 표시된 값들을 대시보드에서 직접 입력 (키는 여기 적지 않는다)
#   3. 백엔드가 뜨면 그 URL 을 프론트의 VITE_API_BASE 와
#      백엔드의 ALLOWED_ORIGINS 에 서로 채워 넣는다

services:
  # ── 백엔드 ────────────────────────────────────────────────
  - type: web
    name: staymove-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore          # 한국에서 가장 가깝다
    # 실측: 컨테이너에서 torch + 임베딩 모델을 올리면 1.1GB 를 쓴다.
    #   512MB → OOM Killed (스레드를 1개로 줄여도 마찬가지)
    #   1GB   → 뜨긴 하지만 96% 라 부하가 오면 죽는다
    #   2GB   → 54%, 연속 요청에도 안정
    # torch 를 들어내기 전까지는 standard 미만으로 못 내려간다.
    plan: standard
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # 워밍업을 켜 두면 첫 요청의 지연이 사라진다. 대신 기동이 그만큼 늦다(약 20초).
      # 끄더라도 첫 요청에서 결국 같은 메모리를 쓰므로 플랜을 낮추는 효과는 없다.
      - key: WARMUP_MODELS
        value: "true"
      # torch/BLAS 가 코어 수만큼 스레드를 잡는다. 컨테이너에서는 낭비라 묶어 둔다.
      - key: OMP_NUM_THREADS
        value: "2"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      # 프론트 주소. 배포 후 실제 도메인으로 바꾼다. 비워 두면 모든 출처를 허용한다.
      - key: ALLOWED_ORIGINS
        sync: false
      # 아래는 전부 대시보드에서 입력한다. 저장소에 두지 않는다.
      - key: NCP_APIGW_KEY_ID
        sync: false
      - key: NCP_APIGW_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_NAME
        value: gpt-4o-mini
      - key: ENABLE_LLM_EXPLANATION
        sync: false
      - key: BIZINFO_API_KEY
        sync: false
      - key: SOSANGONG_SERVICE_KEY
        sync: false

  # ── 프론트 ────────────────────────────────────────────────
  - type: web
    name: staymove-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      # 빌드 시점에 번들에 박힌다. 백엔드 URL 을 넣는다.
      #   예) https://staymove-api.onrender.com
      - key: VITE_API_BASE
        sync: false
      - key: VITE_NCP_MAP_KEY_ID
        sync: false
    routes:
      # 단일 페이지라 어떤 경로로 들어와도 index.html 을 준다
      - type: rewrite
        source: /*
        destination: /index.html
