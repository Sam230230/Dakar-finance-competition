# Render Blueprint — 백엔드(Docker)와 프론트(정적) 두 서비스.
#
# 프론트를 컨테이너에 넣지 않는다. 빌드 결과가 657KB 정적 파일이라
# 정적 호스팅이 더 싸고 빠르다.
#
# 처음 올릴 때:
#   1. Render 대시보드 → New → Blueprint → 이 저장소 선택
#   2. sync:false 로 표시된 값들을 대시보드에서 직접 입력 (키는 여기 적지 않는다)
#   3. 백엔드가 뜨면 그 URL 을 프론트의 VITE_API_BASE 와
#      백엔드의 ALLOWED_ORIGINS 에 서로 채워 넣는다

services:
  # ── 백엔드 ────────────────────────────────────────────────
  - type: web
    name: staymove-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore          # 한국에서 가장 가깝다
    plan: starter              # 512MB. 워밍업 후 225MB 를 쓰므로 여유가 크지 않다
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # 워밍업을 켜 두면 첫 요청의 2.2초가 사라진다. 대신 기동이 그만큼 늦다.
      - key: WARMUP_MODELS
        value: "true"
      # 프론트 주소. 배포 후 실제 도메인으로 바꾼다. 비워 두면 모든 출처를 허용한다.
      - key: ALLOWED_ORIGINS
        sync: false
      # 아래는 전부 대시보드에서 입력한다. 저장소에 두지 않는다.
      - key: NCP_APIGW_KEY_ID
        sync: false
      - key: NCP_APIGW_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_NAME
        value: gpt-4o-mini
      - key: ENABLE_LLM_EXPLANATION
        sync: false
      - key: BIZINFO_API_KEY
        sync: false
      - key: SOSANGONG_SERVICE_KEY
        sync: false

  # ── 프론트 ────────────────────────────────────────────────
  - type: web
    name: staymove-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    autoDeployTrigger: commit
    envVars:
      # 빌드 시점에 번들에 박힌다. 백엔드 URL 을 넣는다.
      #   예) https://staymove-api.onrender.com
      - key: VITE_API_BASE
        sync: false
      - key: VITE_NCP_MAP_KEY_ID
        sync: false
    routes:
      # 단일 페이지라 어떤 경로로 들어와도 index.html 을 준다
      - type: rewrite
        source: /*
        destination: /index.html
